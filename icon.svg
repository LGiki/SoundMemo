<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="400" height="400">
  <!-- 外部深灰色圆角设备外壳 -->
  <rect x="5" y="5" width="110" height="110" rx="15" fill="#303030" />
  <rect x="10" y="10" width="100" height="100" rx="12" fill="#252525" />

  <!-- 绿色复古屏幕 -->
  <rect x="15" y="15" width="90" height="65" rx="6" fill="#9EAB71" />

  <!-- 屏幕右上角红色录音指示灯 -->
  <circle cx="95" cy="25" r="4" fill="#E62E2D" />
  <circle cx="94" cy="24" r="1.5" fill="#FF8888" opacity="0.8" /> <!-- 高光 -->

  <!-- === 麦克风主体 === -->
  <!-- 麦克风网罩 -->
  <rect x="50" y="22" width="20" height="32" rx="10" fill="#2A2A2A" />
  <!-- 麦克风网罩高光细节 -->
  <path d="M 54 24 Q 58 22 62 24 L 62 50 Q 58 52 54 50 Z" fill="#444444" opacity="0.6"/>
  <path d="M 52 28 L 54 28 M 52 32 L 54 32 M 52 36 L 54 36 M 52 40 L 54 40 M 52 44 L 54 44" stroke="#111" stroke-width="2" stroke-linecap="round"/>

  <!-- 麦克风支架U型部分 -->
  <path d="M 45 42 A 15 15 0 0 0 75 42" fill="none" stroke="#2A2A2A" stroke-width="4" />
  <!-- 支架立柱和底座 -->
  <line x1="60" y1="57" x2="60" y2="68" stroke="#2A2A2A" stroke-width="5" />
  <line x1="48" y1="68" x2="72" y2="68" stroke="#2A2A2A" stroke-width="5" stroke-linecap="round"/>

  <!-- === 左侧声波 === -->
  <line x1="22" y1="48" x2="22" y2="52" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="42" x2="28" y2="58" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="34" x2="34" y2="66" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="44" x2="40" y2="56" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>

  <!-- === 右侧声波 === -->
  <line x1="80" y1="44" x2="80" y2="56" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="86" y1="34" x2="86" y2="66" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="42" x2="92" y2="58" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="98" y1="48" x2="98" y2="52" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>

  <!-- === 底部三个物理按键 === -->
  <!-- 左侧灰色按键 -->
  <rect x="20" y="85" width="20" height="18" rx="4" fill="#151515" />
  <rect x="22" y="87" width="16" height="14" rx="2" fill="#555555" />
  <!-- 中间红色按键 -->
  <rect x="50" y="85" width="20" height="18" rx="4" fill="#151515" />
  <rect x="52" y="87" width="16" height="14" rx="2" fill="#E62E2D" />
  <!-- 右侧灰色按键 -->
  <rect x="80" y="85" width="20" height="18" rx="4" fill="#151515" />
  <rect x="82" y="87" width="16" height="14" rx="2" fill="#555555" />
</svg>
